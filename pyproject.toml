[project]
name = "quant-research"
version = "0.1.0"
description = "Research into quantization error accumulation over long chain-of-thought reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]
hf = [
    "torch",
    "transformers>=4.51",
    "accelerate",
    "bitsandbytes",
    "datasets",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
